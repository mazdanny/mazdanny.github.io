<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penggabung Murojaah → index.html</title>
<style>
body{margin:0;padding:24px;font-family:system-ui,sans-serif;background:#021114;color:#e2e8f0}
.w{max-width:860px;margin:auto}h1{color:#67e8f9;font-size:1.4rem;margin:0 0 4px}p{font-size:.85rem;color:#94a3b8;margin:4px 0 14px}
.b{padding:14px;border:1px solid #0f766e;border-radius:12px;background:#052920;margin-bottom:12px}
label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:#5eead4}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:#0891b2;color:#fff;margin-right:8px}
button:disabled{opacity:.4}textarea{width:100%;height:160px;background:#010b0d;color:#a7f3d0;border:1px solid #0f766e;border-radius:10px;font:11px monospace}
#log{font-size:.8rem;line-height:1.6;white-space:pre-wrap}.ok{color:#6ee7b7}.er{color:#fca5a5}.wn{color:#fcd34d}
</style>
</head>
<body><div class="w">
<h1>Penggabung Mushaf &amp; Murojaah → index.html</h1>
<p>Pilih kedua file, klik Gabungkan. Semua proses di browser Anda (tidak ada yang diunggah). Hasilnya SATU file utuh, siap ditimpa ke index.html di GitHub.</p>
<div class="b"><label>1. KODE LAMA (website utama, mis. index.html)</label><input type="file" id="fo" accept=".html,.htm,.txt"></div>
<div class="b"><label>2. KODE BARU (Mushaf &amp; Murojaah)</label><input type="file" id="fn" accept=".html,.htm,.txt"></div>
<button id="go">Gabungkan</button><button id="dl" disabled>Unduh index.html</button><button id="cp" disabled>Salin Kode</button>
<div class="b" style="margin-top:14px"><div id="log">Menunggu file…</div></div>
<textarea id="out" readonly placeholder="Hasil gabungan akan tampil di sini"></textarea>
</div>
<script>
(function(){
var P='mj_', $=function(i){return document.getElementById(i)}, result='';
function rd(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsText(f)})}
function ids(t){var s={},m,re=/\bid="([^"]+)"/g;while((m=re.exec(t)))s[m[1]]=1;return s}
function put(t,find,fn,log,label){var i=t.indexOf(find);if(i<0){log.push(['er','GAGAL: '+label]);return t}
  return t.slice(0,i)+fn(find)+t.slice(i+find.length)}

function merge(O,N){
  var log=[],nd=new DOMParser().parseFromString(N,'text/html');
  var css=[].map.call(nd.querySelectorAll('style'),function(s){return s.textContent}).join('\n').replace(/::-webkit-scrollbar[^{]*\{[^}]*\}/g,'');
  var sc=[].filter.call(nd.querySelectorAll('script:not([src])'),function(s){return s.textContent.indexOf('const surahList')>-1})[0];
  if(!sc)throw new Error('Script utama KODE BARU tidak ditemukan. Pastikan file kedua benar.');
  var js=sc.textContent;
  var keys=['mushaf','dashboard','input','quran','history'];
  var secs=keys.map(function(k){var e=nd.getElementById('view-'+k);if(!e)throw new Error('Section view-'+k+' tidak ditemukan');return e.outerHTML}).join('\n');
  var hd=nd.querySelector('main > header');if(!hd)throw new Error('Header KODE BARU tidak ditemukan');
  var headerHTML=hd.outerHTML.split('sticky top-0 z-30').join('');
  var toast=nd.getElementById('toastNotification').outerHTML;

  /* ganti nama semua fungsi & variabel global KODE BARU dengan awalan mj_ */
  var names={},m,r1=/^ {0,8}(?:async\s+)?function\s+(\w+)/gm,r2=/^ {0,8}(?:let|const|var)\s+(\w+)/gm;
  while((m=r1.exec(js)))names[m[1]]=1;while((m=r2.exec(js)))names[m[1]]=1;
  var list=Object.keys(names);
  function rn(s){list.forEach(function(n){s=s.replace(new RegExp('\\b'+n+'\\b','g'),P+n)});return s}
  var OLDC='w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm',NEWC='flex items-center gap-2 px-3 py-2 rounded-xl font-medium text-xs';
  js=rn(js).split(OLDC).join(NEWC);
  if(js.indexOf('window.onload = function()')<0)throw new Error('window.onload tidak ditemukan di KODE BARU');
  js=js.replace('window.onload = function()',function(){return 'window.mj_init = function()'});
  js+='\nwindow.addEventListener("DOMContentLoaded", window.mj_init);\n';

  var tabs=[['mushaf','fa-book-open','Mushaf Pojok 15 Baris'],['dashboard','fa-chart-line','Dashboard Rekap'],['input','fa-pen-to-square','Catat Murojaah'],['quran','fa-list-ol','Daftar 114 Surah'],['history','fa-clock-rotate-left','Riwayat Mutaba\'ah']];
  var nav=tabs.map(function(t,i){
    var cls=NEWC+' transition-all duration-200 '+(i===0?'bg-rose-50 text-mushafRed font-bold':'text-slate-600 hover:bg-slate-100 hover:text-slate-900');
    return '<button onclick="'+P+'switchTab(\''+t[0]+'\')" id="nav-'+t[0]+'" class="nav-item '+cls+'"><i class="fa-solid '+t[1]+'"></i><span>'+t[2]+'</span></button>'}).join('');

  var portal='<!-- MENU 8: MUROJAAH / MUSHAF -->\n<div id="portal-murojaah" class="w-full max-w-6xl hidden space-y-4">\n'+
   '<button onclick="switchPortal(\'home\')" class="text-xs font-bold text-cyan-400 hover:text-cyan-300 flex items-center gap-2 bg-teal-950 px-3 py-1.5 rounded-lg border border-teal-800 w-fit"><i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard</button>\n'+
   '<div class="mj-scope bg-slate-100 text-slate-800 rounded-3xl p-3 md:p-5 space-y-4 font-sans">\n'+
   '<div class="bg-white rounded-2xl border border-slate-200 p-2 flex flex-wrap gap-1 shadow-sm">'+nav+'</div>\n'+
   '<span id="mobileMenuBtn" class="hidden"></span><span id="sidebar" class="hidden"></span>\n'+
   rn(headerHTML)+'\n<div class="space-y-6">\n'+rn(secs)+'\n</div>\n'+rn(toast)+'\n</div>\n</div>\n\n';

  /* cek bentrok */
  var oi=ids(O),ni=ids(portal),clash=Object.keys(ni).filter(function(k){return oi[k]});
  if(clash.length)log.push(['wn','ID bentrok (cek manual): '+clash.join(', ')]);else log.push(['ok','Tidak ada ID HTML yang bentrok.']);
  var oc=[].map.call(O.matchAll?O.matchAll(/<style[\s\S]*?<\/style>/g):[],function(x){return x[0]}).join(''),cc=[],cm,cr=/\.([a-zA-Z][\w-]*)/g;
  while((cm=cr.exec(css.replace(/url\([^)]*\)/g,''))))if(cc.indexOf(cm[1])<0)cc.push(cm[1]);
  var cl=cc.filter(function(c){return new RegExp('\\.'+c+'(?![\\w-])').test(oc)});
  if(cl.length)log.push(['wn','Kelas CSS bentrok: '+cl.join(', ')]);else log.push(['ok','Tidak ada kelas CSS yang bentrok.']);
  log.push(['ok','Nama fungsi/variabel JS KODE BARU diberi awalan "mj_" ('+list.length+' nama): tidak ada bentrok.']);

  var T=O;
  /* font + Tailwind config + CSS */
  T=put(T,'</head>',function(f){return '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">\n<style id="mj-style">\n'+css+'\n</style>\n'+f},log,'</head>');
  if(T.indexOf('tailwind.config')>-1)log.push(['wn','KODE LAMA sudah punya tailwind.config: gabungkan warna mushafRed, mushafRedBorder, islamicGreen, islamicDarkGreen secara manual.']);
  else T=put(T,'<script src="https://cdn.tailwindcss.com"><\/script>',function(f){return f+'\n<script>tailwind.config={theme:{extend:{colors:{islamicGreen:"#059669",islamicDarkGreen:"#047857",mushafRed:"#be123c",mushafRedBorder:"#9f1239",mushafGold:"#d97706",mushafPaper:"#fffdfa"},fontFamily:{arabic:["Noto Naskh Arabic","Scheherazade New","Amiri","serif"]}}}}<\/script>'},log,'Tailwind CDN');
  /* navbar */
  var rb=/<button onclick="switchPortal\('game-edu'\)"[\s\S]*?<\/button>/,mb=T.match(rb);
  if(mb)T=T.replace(rb,function(f){return f+'\n<button onclick="switchPortal(\'murojaah\')" id="btn-portal-murojaah" class="nav-tab px-2.5 py-1.5 rounded-lg border border-teal-800 text-[11px] font-semibold tracking-wider text-gray-300 hover:text-white transition-all">\n<i class="fa-solid fa-book-quran mr-1"></i> 8. MUROJAAH\n</button>'});
  else log.push(['er','GAGAL: tombol navbar Game Edu tidak ditemukan']);
  /* tile dashboard */
  var tile='<div onclick="switchPortal(\'murojaah\')" class="metro-tile p-6 rounded-2xl cursor-pointer flex flex-col justify-between h-48 border-rose-500/40">\n<div class="flex items-center justify-between">\n<span class="w-12 h-12 bg-rose-950/80 rounded-xl flex items-center justify-center text-rose-300 text-2xl border border-rose-500/30"><i class="fa-solid fa-book-quran"></i></span>\n<span class="text-[10px] font-bold text-rose-300 bg-rose-950 px-2.5 py-1 rounded-full uppercase border border-rose-500/30">Menu 8</span>\n</div>\n<div>\n<h3 class="text-lg font-bold text-white tracking-wide">MUSHAF &amp; MUROJAAH</h3>\n<p class="text-xs text-gray-300 mt-1">Mushaf Pojok Indonesia 15 baris, 114 surah, dan rekap murojaah hafalan.</p>\n</div>\n</div>\n';
  var rt=/(<\/p>\s*<\/div>\s*<\/div>\s*)(<\/div>\s*<\/div>\s*<!-- MENU 1: AL-ISLAM KELAS 3 -->)/;
  if(rt.test(T))T=T.replace(rt,function(a,b,c){return b+tile+c});else log.push(['er','GAGAL: posisi tile dashboard tidak ditemukan']);
  /* switchPortal */
  var ps="'guru', 'game-edu'];";
  if(T.indexOf(ps)>-1)T=T.replace(ps,function(){return "'guru', 'game-edu', 'murojaah'];"});else log.push(['er','GAGAL: daftar portals di switchPortal tidak ditemukan']);
  /* portal + script */
  T=put(T,'<!-- Footer Utama -->',function(f){return portal+f},log,'Footer Utama');
  var bi=T.lastIndexOf('</body>');
  if(bi<0)log.push(['er','GAGAL: </body> tidak ditemukan']);
  else T=T.slice(0,bi)+'<script>\n/* ===== MODUL MUSHAF & MUROJAAH (fungsi/variabel berawalan mj_) ===== */\n'+js+'<\/script>\n'+T.slice(bi);
  return {html:T,log:log};
}

function show(log){$('log').innerHTML=log.map(function(l){return '<div class="'+l[0]+'">'+(l[0]==='ok'?'✔ ':l[0]==='er'?'✖ ':'⚠ ')+l[1].replace(/</g,'&lt;')+'</div>'}).join('')}

$('go').onclick=async function(){
  var a=$('fo').files[0],b=$('fn').files[0];
  if(!a||!b){show([['er','Pilih kedua file terlebih dahulu.']]);return}
  try{
    var r=merge(await rd(a),await rd(b));result=r.html;
    var bad=r.log.some(function(l){return l[0]==='er'});
    if(!bad)r.log.push(['ok','Selesai! '+Math.round(result.length/1024)+' KB. Unduh atau salin lalu timpa index.html.']);
    show(r.log);$('out').value=result;$('dl').disabled=$('cp').disabled=bad;
  }catch(e){show([['er',e.message]])}
};
$('dl').onclick=function(){var u=URL.createObjectURL(new Blob([result],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='index.html';document.body.appendChild(a);a.click();a.remove()};
$('cp').onclick=function(){$('out').select();(navigator.clipboard?navigator.clipboard.writeText(result):Promise.reject()).catch(function(){document.execCommand('copy')});show([['ok','Kode tersalin ke clipboard.']])};
})();
</script></body></html>
