function seed(){let n=0;for(const [name,str] of Object.entries(DATA)){if(S.classes.some(c=>c.name===name))continue;
  S.classes.push({id:uid(),name,students:str.split('|').map(x=>({id:uid(),name:x}))});n++}
  if(!S.cur&&S.classes[0])S.cur=S.classes[0].id;S.seeded=1;save();return n}
if(!S.seeded)seed();
const cls=()=>S.classes.find(c=>c.id===S.cur);
const getA=(c,s)=>{const a=(S.ans[c.id+'|'+mp()]=S.ans[c.id+'|'+mp()]||{});const r=a[s]=a[s]||{pg:[],es:[],ur:[],nt:[],ph:[]};r.ur=r.ur||[];r.sw=r.sw||{};return r};
const sumArr=(arr,max)=>max.reduce((t,m,i)=>t+Math.min(Math.max(0,+arr[i]||0),+m||0),0);
const r2=x=>Math.round(x*100)/100;
const filled=x=>x!==undefined&&x!==''&&x!==null;
const sumMax=a=>a.reduce((x,y)=>x+(+y||0),0);
function maxTotal(c){const f=cfgOf(c);return f.n*f.pt+sumMax(f.es)+sumMax(f.ur)}
function calc(c,sid){
  const f=cfgOf(c),a=((S.ans[c.id+'|'+mp()]||{})[sid])||{pg:[],es:[],ur:[]};
  const A_es=a.es||[],A_ur=a.ur||[],sw=a.sw||{};
  const ur=sumArr(A_ur,f.ur),M=maxTotal(c);
  let ok=0,pg=0,es=0,done=false;
  if(S.mode==='salah'){
    /* MODE CEPAT: skor = skor penuh - (jumlah salah x poin per soal) */
    const wp=filled(sw.pg)?Math.min(Math.max(0,+sw.pg||0),f.n):null;
    const we=filled(sw.es)?Math.min(Math.max(0,+sw.es||0),f.es.length):null;
    const esMax=sumMax(f.es),perEs=f.es.length?esMax/f.es.length:0;
    if(wp!==null){ok=f.n-wp;pg=ok*f.pt}
    if(we!==null){es=r2(esMax-we*perEs)}
    done=wp!==null||we!==null||A_ur.some(filled);
  }else{
    /* MODE DETAIL: PG dicocokkan dengan kunci, isian & uraian isi skor per nomor */
    for(let i=0;i<f.n;i++)if(a.pg[i]&&a.pg[i]===f.key[i])ok++;
    pg=ok*f.pt;es=sumArr(A_es,f.es);
    done=a.pg.some(x=>x)||A_es.some(filled)||A_ur.some(filled);
  }
  return{ok,pg,es,ur,total:M?Math.round((pg+es+ur)/M*1000)/10:0,done}
}

/* ===== Kelas ===== */
function addClass(){const n=$('#newCls').value.trim();if(!n)return;
  const c={id:uid(),name:n,students:[]};
  S.classes.push(c);S.cur=c.id;stu=null;save();render()}
function pickClass(id){S.cur=id;stu=null;save();render()}
function delClass(id){if(!confirm('Hapus kelas beserta semua datanya?'))return;
  S.classes=S.classes.filter(c=>c.id!==id);Object.keys(S.ans).filter(k=>k.startsWith(id+'|')).forEach(k=>delete S.ans[k]);S.cur=S.classes[0]?.id||null;stu=null;save();render()}
function addNames(list){const c=cls();if(!c)return alert('Buat kelas dulu.');
  const ex=new Set(c.students.map(s=>s.name.toLowerCase()));let n=0;
  list.map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!ex.has(x.toLowerCase())){c.students.push({id:uid(),name:x});ex.add(x.toLowerCase());n++}});
  save();render();alert(n+' siswa ditambahkan.')}
function importPaste(){addNames($('#paste').value.split(/\r?\n/).map(l=>l.replace(/^\s*\d+[.)]\s*/,'')))}
function importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let rows=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    const sep=(rows[0]||'').includes(';')?';':',';
    let col=0;const h=(rows[0]||'').split(sep).map(x=>x.trim().toLowerCase().replace(/"/g,''));
    const hi=h.findIndex(x=>x.includes('nama'));
    if(hi>=0){col=hi;rows.shift()}
    addNames(rows.map(l=>(l.split(sep)[col]||'').replace(/"/g,'')))};
  r.readAsText(f);inp.value=''}
function delStu(id){const c=cls();c.students=c.students.filter(s=>s.id!==id);Object.keys(S.ans).filter(k=>k.startsWith(c.id+'|')).forEach(k=>delete S.ans[k][id]);if(stu===id)stu=null;save();render()}

/* ===== Kunci & Bobot ===== */
function setCfg(k,v){const f=cfgOf(cls());f[k]=Math.max(0,+v||0);save();render()}
function setCount(k,v){const f=cfgOf(cls()),d=k==='es'?3:4;v=Math.max(0,Math.min(30,+v||0));while(f[k].length<v)f[k].push(d);f[k].length=v;save();render()}
function setMax(k,i,v){cfgOf(cls())[k][i]=Math.max(0,+v||0);save();render()}
function setMaxAll(k){const el=$('#all_'+k);const v=Math.max(0,+el.value||0);const f=cfgOf(cls());f[k]=f[k].map(()=>v);save();render()}
function setKey(i,l){const k=cfgOf(cls()).key;k[i]=k[i]===l?'':l;save();render()}
function setRub(i,v){const f=cfgOf(cls());f.rub=f.rub||[];f.rub[i]=v;save()}
function copyCfg(){if(!confirm('Salin kunci & bobot mapel '+mp()+' dari kelas ini ke SEMUA kelas? Pengaturan mapel ini di kelas lain akan ditimpa.'))return;const j=JSON.stringify(cfgOf(cls()));S.classes.forEach(k=>{k.cfgs=k.cfgs||{};k.cfgs[mp()]=JSON.parse(j)});save();alert('Tersalin ke '+S.classes.length+' kelas.')}

/* ===== Koreksi ===== */
function pickStu(id){stu=id;render()}
function setPg(i,l){const a=getA(cls(),stu);a.pg[i]=a.pg[i]===l?'':l;save();render()}
function quickPg(v){const c=cls(),a=getA(c,stu);
  if(/\d/.test(v)){const re=/(\d+)\s*[.:=\-)]?\s*([A-Da-d])/g;let m;
    while((m=re.exec(v))){const i=+m[1]-1;if(i>=0&&i<cfgOf(c).n)a.pg[i]=m[2].toUpperCase()}}
  else{const ch=v.toUpperCase().replace(/[^ABCD\-]/g,'').split('');
    for(let i=0;i<cfgOf(c).n;i++)a.pg[i]=(ch[i]&&ch[i]!=='-')?ch[i]:''}
  save();render()}
/* skor isian (es) & uraian (ur): tanpa render ulang agar kursor tidak hilang */
function setSc(k,i,el){const c=cls(),a=getA(c,stu),m=+cfgOf(c)[k][i]||0;
  if(el.value===''){a[k][i]=''}
  else{const n=Math.min(Math.max(0,+el.value||0),m);a[k][i]=n;el.value=n}
  save();upd()}
/* jumlah salah (mode cepat): k = 'pg' atau 'es' */
function setSw(k,el){const c=cls(),a=getA(c,stu),f=cfgOf(c),m=k==='pg'?f.n:f.es.length;
  if(el.value===''){a.sw[k]=''}
  else{const n=Math.min(Math.max(0,Math.round(+el.value||0)),m);a.sw[k]=n;el.value=n}
  save();upd()}
function badges(c,r,f){return `<span class="bg-emerald-100 px-3 py-1 rounded-full text-sm">PG: ${r.ok}/${f.n} = <b>${r.pg}</b></span>
   <span class="bg-amber-100 px-3 py-1 rounded-full text-sm">Isian: <b>${r.es}</b></span>
   <span class="bg-sky-100 px-3 py-1 rounded-full text-sm">Uraian: <b>${r.ur}</b></span>
   <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm">Nilai: <b>${r.total}</b></span>`}
function upd(){const c=cls(),f=cfgOf(c),r=calc(c,stu);
  const b=$('#badges');if(b)b.innerHTML=badges(c,r,f);
  const li=document.querySelector('[data-s="'+stu+'"] .tot');if(li)li.textContent=r.done?'✔ '+r.total:'';
  const pp=$('#pv_pg');if(pp)pp.textContent=r.pg+' / '+(f.n*f.pt);
  const pe=$('#pv_es');if(pe)pe.textContent=r.es+' / '+sumMax(f.es)}
function nextSc(e){if(e.key!=='Enter')return;e.preventDefault();
  const all=[...document.querySelectorAll('input.sc')],i=all.indexOf(e.target);
  if(all[i+1]){all[i+1].focus();all[i+1].select()}}
function nav(d){const c=cls(),i=c.students.findIndex(s=>s.id===stu)+d;if(c.students[i]){stu=c.students[i].id;render()}}

/* ===== Ekspor ===== */
function rows(c){return c.students.map((s,i)=>{const r=calc(c,s.id);return[i+1,s.name,r.pg,r.es,r.ur,r.total]})}
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function exportCsv(){const c=cls();
  const l=[['No','Nama Siswa','Skor PG','Skor Isian','Skor Uraian','Nilai Akhir'],...rows(c)].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';'));
  dl('Rekap_'+c.name+'_'+mp()+'.csv','text/csv;charset=utf-8','\uFEFFsep=;\n'+l.join('\n'))}
function exportXls(){const c=cls();
  const t='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><h3>Rekapitulasi Nilai - '+esc(c.name)+' - '+esc(mp())+'</h3><table border="1" style="border-collapse:collapse"><tr style="background:#e0e7ff;font-weight:bold"><td>No</td><td>Nama Siswa</td><td>Skor PG</td><td>Skor Isian</td><td>Skor Uraian</td><td>Nilai Akhir</td></tr>'
   +rows(c).map(r=>'<tr>'+r.map((x,i)=>'<td'+(i===1?'':' align="center"')+'>'+esc(x)+'</td>').join('')+'</tr>').join('')
   +'</table><p>Skor maksimal: '+maxTotal(c)+'</p></body></html>';
  dl('Rekap_'+c.name+'_'+mp()+'.xls','application/vnd.ms-excel',t)}

const TABS=[['kelas','👥 Kelas & Siswa'],['kunci','🔑 Kunci & Bobot'],['nilai','✍️ Koreksi'],['rekap','📊 Rekap & Ekspor']];
const card='bg-white rounded-xl shadow p-4 mb-4',btn='px-3 py-2 rounded-lg text-sm font-medium ',pri=btn+'bg-indigo-600 text-white hover:bg-indigo-700',inp='border rounded-lg px-3 py-2 text-sm';
function opt(handler,i,val,pickedFn){return['A','B','C','D'].map(l=>`<button onclick="${handler}(${i},'${l}')" class="w-8 h-8 rounded-md text-xs font-bold border ${pickedFn(l,val)}">${l}</button>`).join('')}
function render(){
  $('#clsSel').innerHTML=S.classes.length?S.classes.map(c=>`<option value="${c.id}" ${c.id===S.cur?'selected':''}>${esc(c.name)}</option>`).join(''):'<option>(belum ada kelas)</option>';
  $('#nav').innerHTML=TABS.map(([k,t])=>`<button onclick="tab='${k}';render()" class="px-4 py-2 text-sm whitespace-nowrap rounded-t-lg ${tab===k?'bg-slate-100 text-indigo-700 font-semibold':'text-indigo-100 hover:bg-indigo-500'}">${t}</button>`).join('');
  $('#mapSel').innerHTML=[...MAPEL,...S.customs].map(m=>`<option ${m===mp()?'selected':''}>${esc(m)}</option>`).join('')+'<option value="__new">➕ Lainnya (isi sendiri)…</option>';
  $('#modeBtns').innerHTML=[['detail','🎯 Mode Detail'],['salah','⚡ Mode Cepat (Jumlah Salah)']].map(([k,t])=>`<button onclick="setMode('${k}')" class="px-2.5 py-1 rounded-md text-xs font-semibold ${S.mode===k?'bg-white text-indigo-700':'text-indigo-100 hover:bg-indigo-500'}">${t}</button>`).join('');
  const c=cls();
  if(!c&&tab!=='kelas')tab='kelas';
  $('#main').innerHTML={kelas:vKelas,kunci:vKunci,nilai:vNilai,rekap:vRekap}[tab](c);
}
function vKelas(c){
  return `<div class="${card}"><h2 class="font-bold mb-2">Buat Kelas Baru</h2>
  <div class="flex gap-2"><input id="newCls" class="${inp} flex-1" placeholder="Contoh: Kelas 6A" onkeydown="if(event.key==='Enter')addClass()"><button class="${pri}" onclick="addClass()">+ Tambah</button><button class="${btn}bg-slate-200" onclick="alert(seed()+' kelas dipulihkan.');render()">↻ Pulihkan daftar sekolah</button></div>
  <div class="mt-3 flex flex-wrap gap-2">${S.classes.map(k=>`<span class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm ${k.id===S.cur?'bg-indigo-600 text-white':'bg-slate-200'}"><button onclick="pickClass('${k.id}')">${esc(k.name)} (${k.students.length})</button><button onclick="delClass('${k.id}')" title="Hapus">✕</button></span>`).join('')||'<p class="text-sm text-slate-500">Belum ada kelas.</p>'}</div></div>`
  +(c?`<div class="grid md:grid-cols-2 gap-4"><div class="${card}"><h2 class="font-bold mb-2">Impor Nama Siswa — ${esc(c.name)}</h2>
  <p class="text-xs text-slate-500 mb-2">Tempel daftar nama (satu nama per baris, boleh dari Excel/Word).</p>
  <textarea id="paste" rows="7" class="${inp} w-full" placeholder="Ani Lestari&#10;Budi Santoso&#10;..."></textarea>
  <button class="${pri} mt-2" onclick="importPaste()">Impor dari Teks</button>
  <div class="mt-4 border-t pt-3"><p class="text-xs text-slate-500 mb-1">Atau unggah CSV/TXT (kolom "Nama" atau kolom pertama). File Excel: Simpan Sebagai → CSV dulu.</p>
  <input type="file" accept=".csv,.txt" onchange="importFile(this)" class="text-sm"></div></div>
  <div class="${card}"><h2 class="font-bold mb-2">Daftar Siswa (${c.students.length})</h2>
  <ol class="text-sm max-h-96 overflow-auto divide-y">${c.students.map((s,i)=>`<li class="flex justify-between py-1.5"><span>${i+1}. ${esc(s.name)}</span><button class="text-red-500" onclick="delStu('${s.id}')">hapus</button></li>`).join('')||'<li class="text-slate-500">Belum ada siswa.</li>'}</ol></div></div>`:'');
}
/* bagian kecil: skor maks per nomor (ringkas) */
function maxBlock(c,k,title,start){const f=cfgOf(c),arr=f[k];
  return `<div class="${card}"><h2 class="font-bold mb-3">${title}</h2>
  <div class="flex flex-wrap items-center gap-3 mb-3 text-sm">
   <label>Jumlah soal <input type="number" min="0" max="30" value="${arr.length}" onchange="setCount('${k}',this.value)" class="${inp} w-20 ml-1"></label>
   <span class="flex items-center gap-1">Samakan skor maks: <input id="all_${k}" type="number" min="0" step="0.5" class="${inp} w-20" placeholder="${k==='es'?3:4}"><button class="${btn}bg-slate-200" onclick="setMaxAll('${k}')">Terapkan</button></span>
   <span class="text-slate-500">Total: <b>${sumMax(arr)}</b></span></div>
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2">${arr.map((m,i)=>`<label class="flex items-center gap-1 text-xs"><span class="w-7 text-right text-slate-500">${start+i}.</span><input type="number" min="0" step="0.5" value="${m}" onchange="setMax('${k}',${i},this.value)" class="${inp} w-16 !py-1"></label>`).join('')||'<p class="text-sm text-slate-500 col-span-full">Tidak ada soal.</p>'}</div></div>`}
function vKunci(c){const f=cfgOf(c),salah=S.mode==='salah';
  return `<div class="${card}"><h2 class="font-bold mb-3">Pilihan Ganda — ${esc(c.name)} · ${esc(mp())}</h2>
  <div class="flex flex-wrap gap-4 mb-3 text-sm"><label>Jumlah soal PG <input type="number" min="0" max="100" value="${f.n}" onchange="setCfg('n',this.value)" class="${inp} w-20 ml-1"></label>
  <label>Poin per soal benar <input type="number" min="0" step="0.5" value="${f.pt}" onchange="setCfg('pt',this.value)" class="${inp} w-20 ml-1"></label>
  <span class="self-center text-slate-500">Total PG: <b>${f.n*f.pt}</b></span></div>
  ${salah?`<p class="text-sm bg-amber-50 rounded-lg p-3">⚡ <b>Mode Cepat aktif:</b> kunci jawaban PG tidak diperlukan. Skor PG = ${f.n*f.pt} − (jumlah salah × ${f.pt}). Contoh: salah 0 → ${f.n*f.pt}, salah 1 → ${f.n*f.pt-f.pt}. Pindah ke Mode Detail untuk mengisi kunci.</p>`
  :`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-1">${Array.from({length:f.n},(_,i)=>`<div class="flex items-center gap-2"><span class="w-7 text-right text-sm text-slate-500">${i+1}.</span>${opt('setKey',i,f.key[i],(l,v)=>v===l?'bg-indigo-600 text-white border-indigo-600':'bg-white hover:bg-slate-100')}</div>`).join('')}</div>`}</div>
  ${maxBlock(c,'es','Isian Singkat — skor maksimal per nomor',f.n+1)}
  ${maxBlock(c,'ur','Uraian — skor maksimal per nomor',f.n+f.es.length+1)}
  <div class="${card}">
  <p class="text-sm bg-indigo-50 rounded-lg p-3">Skor maksimal total: <b>${maxTotal(c)}</b> &nbsp;|&nbsp; PG ${f.n*f.pt} + Isian ${sumMax(f.es)} + Uraian ${sumMax(f.ur)} &nbsp;|&nbsp; Kunci PG terisi: <b>${f.key.filter(Boolean).length}/${f.n}</b></p>
  <details class="mt-3 text-sm"><summary class="cursor-pointer text-slate-600">Catatan kunci isian/uraian (opsional)</summary>
   <div class="mt-2 space-y-1">${[...f.es.map((_,i)=>['Isian',f.n+1+i,i]),...f.ur.map((_,i)=>['Uraian',f.n+f.es.length+1+i,f.es.length+i])].map(([t,no,ri])=>`<label class="flex items-start gap-2 text-xs"><span class="w-24 shrink-0 text-right text-slate-500 pt-2">${t} ${no}</span><textarea rows="1" class="${inp} w-full !py-1" onchange="setRub(${ri},this.value)">${esc((f.rub||[])[ri]||'')}</textarea></label>`).join('')}</div></details>
  <button class="${btn}bg-slate-700 text-white mt-3" onclick="copyCfg()">📋 Salin kunci & bobot ini ke semua kelas</button></div>`}
/* kotak skor per nomor (isian detail / uraian) */
function scBlock(c,k,title,start,a,f){const arr=f[k];
  if(!arr.length)return '';
  return `<div class="${card}"><h3 class="font-semibold mb-2">${title} <span class="text-xs font-normal text-slate-400">— isi skor per nomor (Enter = pindah ke kotak berikutnya)</span></h3>
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-x-4 gap-y-2">${arr.map((m,i)=>`<label class="flex items-center gap-1 text-sm"><span class="w-7 text-right text-slate-500">${start+i}.</span><input type="number" inputmode="decimal" min="0" max="${m}" step="0.5" value="${a[k][i]??''}" onchange="setSc('${k}',${i},this)" onkeydown="nextSc(event)" onfocus="this.select()" class="sc ${inp} w-16 !py-1 text-center"><span class="text-xs text-slate-400">/${m}</span></label>`).join('')}</div></div>`}
/* kotak jumlah salah (mode cepat) untuk PG atau isian */
function swBlock(c,k,title,a,f,r){
  const max=k==='pg'?f.n:f.es.length,tot=k==='pg'?f.n*f.pt:sumMax(f.es),per=max?r2(tot/max):0;
  return `<div class="${card}"><h3 class="font-semibold mb-2">${title}</h3>
  <div class="flex flex-wrap items-center gap-3 text-sm">
   <label>Jumlah salah <input type="number" inputmode="numeric" min="0" max="${max}" step="1" value="${a.sw[k]??''}" onchange="setSw('${k}',this)" onkeydown="nextSc(event)" onfocus="this.select()" class="sc ${inp} w-24 ml-1 text-center"> <span class="text-xs text-slate-400">dari ${max} soal</span></label>
   <span class="bg-slate-100 rounded-lg px-3 py-2">Skor: <b id="pv_${k}">${k==='pg'?r.pg:r.es} / ${tot}</b></span>
   <span class="text-xs text-slate-400">Salah 0 → ${tot}, salah 1 → ${r2(tot-per)}, salah 2 → ${r2(tot-2*per)} … (tiap salah −${per})</span></div></div>`}
function vNilai(c){
  const list=`<div class="${card} md:w-64 shrink-0 max-h-[75vh] overflow-auto"><h2 class="font-bold mb-2 text-sm">Siswa</h2>${c.students.map((s,i)=>{const r=calc(c,s.id);return`<button data-s="${s.id}" onclick="pickStu('${s.id}')" class="w-full text-left text-sm px-2 py-1.5 rounded-lg flex justify-between ${s.id===stu?'bg-indigo-600 text-white':'hover:bg-slate-100'}"><span class="truncate">${i+1}. ${esc(s.name)}</span><span class="tot">${r.done?'✔ '+r.total:''}</span></button>`}).join('')||'<p class="text-sm text-slate-500">Impor siswa dulu.</p>'}</div>`;
  if(!stu||!c.students.find(s=>s.id===stu))return`<div class="flex flex-col md:flex-row gap-4">${list}<div class="${card} flex-1 text-slate-500">Pilih siswa di sebelah kiri untuk mulai mengoreksi.</div></div>`;
  const s=c.students.find(x=>x.id===stu),a=getA(c,stu),f=cfgOf(c),r=calc(c,stu);
  const key=f.key,salah=S.mode==='salah';
  const pgBlock=salah?swBlock(c,'pg','Pilihan Ganda (Mode Cepat)',a,f,r):
  `<div class="${card}"><h3 class="font-semibold mb-2">Pilihan Ganda</h3>
   <label class="text-sm block mb-3">Input cepat — tulis bebas: <b>1 A, 2 C, 3 D, 4 B, ...</b> (boleh sebagian nomor saja) atau huruf berurutan <b>ACDB...</b> (<b>-</b> = kosong). Klik di luar kotak / tekan Tab untuk memproses.
   <textarea rows="2" class="${inp} w-full mt-1 font-mono uppercase" onchange="quickPg(this.value)" placeholder="1 A, 2 C, 3 D, 4 B, 5 A ..."></textarea></label>
   <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-1">${Array.from({length:f.n},(_,i)=>`<div class="flex items-center gap-2"><span class="w-7 text-right text-sm text-slate-500">${i+1}.</span>${opt('setPg',i,a.pg[i],(l,v)=>v!==l?'bg-white hover:bg-slate-100':(!key[i]?'bg-slate-500 text-white':v===key[i]?'bg-emerald-500 text-white border-emerald-500':'bg-red-500 text-white border-red-500'))}${a.pg[i]&&key[i]&&a.pg[i]!==key[i]?`<span class="text-xs text-slate-400">kunci ${key[i]}</span>`:''}</div>`).join('')}</div></div>`;
  const esBlock=salah?swBlock(c,'es','Isian Singkat (Mode Cepat)',a,f,r):scBlock(c,'es','Isian Singkat',f.n+1,a,f);
  return`<div class="flex flex-col md:flex-row gap-4">${list}<div class="flex-1">
  <div class="${card} flex flex-wrap items-center gap-3"><h2 class="font-bold text-lg flex-1">${esc(s.name)}</h2>
   <span id="badges" class="flex flex-wrap gap-2">${badges(c,r,f)}</span>
   <button class="${btn}bg-slate-200" onclick="nav(-1)">◀</button><button class="${btn}bg-slate-200" onclick="nav(1)">▶</button></div>
  ${pgBlock}
  ${esBlock}
  ${scBlock(c,'ur','Uraian',f.n+f.es.length+1,a,f)}
  </div></div>`}
function vRekap(c){
  const R=c.students.map(s=>calc(c,s.id)),v=R.filter(r=>r.done).map(r=>r.total);
  const avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-';
  return`<div class="${card}"><div class="noprint flex flex-wrap gap-2 mb-3"><button class="${pri}" onclick="exportXls()">⬇ Excel (.xls)</button><button class="${btn}bg-emerald-600 text-white" onclick="exportCsv()">⬇ CSV</button><button class="${btn}bg-slate-700 text-white" onclick="window.print()">🖨 Cetak</button></div>
  <h2 class="font-bold">Rekapitulasi Nilai — ${esc(c.name)} · ${esc(mp())}</h2>
  <p class="text-xs text-slate-400 mb-1">Mode penilaian: ${S.mode==='salah'?'Cepat (jumlah salah)':'Detail (kunci jawaban)'}</p>
  <p class="text-sm text-slate-500 mb-3">Skor maksimal: ${maxTotal(c)} · Rata-rata: <b>${avg}</b> · Tertinggi: <b>${v.length?Math.max(...v):'-'}</b> · Terendah: <b>${v.length?Math.min(...v):'-'}</b> · Sudah dikoreksi: ${v.length}/${c.students.length}</p>
  <div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr class="bg-indigo-50 text-left"><th class="border p-2 w-10">No</th><th class="border p-2">Nama Siswa</th><th class="border p-2 text-center">Skor PG</th><th class="border p-2 text-center">Skor Isian</th><th class="border p-2 text-center">Skor Uraian</th><th class="border p-2 text-center">Nilai Akhir</th></tr></thead><tbody>
  ${c.students.map((s,i)=>`<tr><td class="border p-2">${i+1}</td><td class="border p-2">${esc(s.name)}</td><td class="border p-2 text-center">${R[i].pg}</td><td class="border p-2 text-center">${R[i].es}</td><td class="border p-2 text-center">${R[i].ur}</td><td class="border p-2 text-center font-bold">${R[i].done?R[i].total:'-'}</td></tr>`).join('')}</tbody></table></div></div>`}
render();
</script>
</body>
</html>
